spring.jackson.property-naming-strategy=SNAKE_CASE
# Only health and metrics are exposed. Metrics carry counts and timings, never order data.
management.endpoints.web.exposure.include=health,metrics

# A supplier search that runs longer than this is abandoned and the order is reported as not routable in time.
# Set enabled=false to let every search run to completion.
router.search.timeout.enabled=true
router.search.timeout.duration=PT2S
